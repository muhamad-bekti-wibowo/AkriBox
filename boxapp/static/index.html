<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakit Box</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --line:#d9dce2; --text:#1c2026; --muted:#667080;
  --accent:#2563eb; --gagal:#d92d20; --sesak:#c2570c; --awas:#a16207; --ok:#15803d; --info:#667080;
  --view:#e9ecf1; --new:#9333ea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --panel:#1c2027; --line:#2e343e; --text:#e6e9ee; --muted:#939cab;
    --accent:#6ea0ff; --gagal:#ff6b5e; --sesak:#ff9f52; --awas:#e3b341; --ok:#4ade80; --info:#939cab;
    --view:#0f1216; --new:#c084fc; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Segoe UI",sans-serif;
  display:grid;grid-template-rows:auto 1fr;}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650}
header .src{color:var(--muted);max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label.f{display:flex;align-items:center;gap:6px;color:var(--muted)}
input[type=number],input[type=text],select{background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:4px 6px;font:inherit}
input[type=number]{width:70px}
button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:5px 11px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
button.danger:hover{border-color:var(--gagal);color:var(--gagal)}
.badge{margin-left:auto;padding:4px 10px;border-radius:999px;font-weight:650;border:1px solid currentColor}
.badge.ok{color:var(--ok)} .badge.bad{color:var(--gagal)} .badge.stale{color:var(--muted);border-style:dashed}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
aside.left{border-right:1px solid var(--line)} aside.right{border-left:1px solid var(--line)}
h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 12px 6px;
  display:flex;align-items:center;justify-content:space-between}
h2 button{padding:1px 8px;text-transform:none;letter-spacing:0}
.plist div.row{display:flex;gap:8px;align-items:center;padding:6px 12px;cursor:pointer;border-left:3px solid transparent}
.plist div.row:hover{background:var(--bg)}
.plist div.row.sel{background:var(--bg);border-left-color:var(--accent)}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.plist .nm{flex:1;min-width:0}
.plist .nm b{font-weight:600}
.plist .nm small{display:block;color:var(--muted)}
.plist .un{color:var(--awas)}
.plist .nw{color:var(--new)}
.plist .row .rowdel{visibility:hidden;border:none;background:none;color:var(--muted);padding:0 6px;font-size:14px}
.plist .row:hover .rowdel,.plist .row.sel .rowdel{visibility:visible}
.plist .row .rowdel:hover{color:var(--gagal)}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{border-color:var(--line)}
.center{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.tabs button{border-radius:6px 6px 0 0}
#view3d,#view2d{min-height:0;min-width:0;background:var(--view);position:relative;overflow:hidden}
#view2d{display:none;grid-template-rows:auto 1fr auto}
#view2d .bar{border-bottom:1px solid var(--line)}
#stage2d{position:relative;min-height:0;overflow:hidden;background:var(--view)}
#stage2d svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#stage2d.t-circle svg,#stage2d.t-rect svg,#stage2d.t-place svg{cursor:crosshair}
#stage2d.pan svg{cursor:grabbing}
#stage2d polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round}
#stage2d .outline{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--text);stroke-width:1.3px}
#stage2d .tab{fill:color-mix(in srgb,var(--ok) 45%,transparent);stroke:var(--ok);stroke-width:1.1px;cursor:pointer}
#stage2d .slot{fill:color-mix(in srgb,var(--gagal) 40%,transparent);stroke:var(--gagal);stroke-width:1.1px;cursor:pointer}
#stage2d .cut{fill:var(--view);stroke:var(--text);stroke-width:1.1px;cursor:pointer}
#stage2d .guide{fill:transparent;stroke:var(--accent);stroke-width:1.1px;stroke-dasharray:5 4;cursor:pointer;pointer-events:all}
#stage2d .guide:hover{stroke-width:2.4px}
#stage2d .added{stroke:var(--new);stroke-width:1.6px}
#stage2d .cut:hover,#stage2d .slot:hover,#stage2d .tab:hover{stroke-width:2px}
#stage2d .sel{stroke:var(--accent)!important;stroke-width:2.6px!important;fill:color-mix(in srgb,var(--accent) 30%,var(--view))!important}
#stage2d .preview{fill:color-mix(in srgb,var(--new) 25%,transparent);stroke:var(--new);stroke-width:1.5px;
  stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
#stage2d .edge{stroke:transparent;stroke-width:14px;vector-effect:non-scaling-stroke;cursor:ew-resize;pointer-events:stroke}
#stage2d .edge.h{cursor:ns-resize}
#stage2d .vh{fill:var(--bg,#fff);stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:move}
#stage2d .vh:hover,#stage2d .vh.on{fill:var(--accent)}
#stage2d .eh{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:1px;vector-effect:non-scaling-stroke;cursor:move}
#stage2d .eh:hover{fill-opacity:.9}
#stage2d .snapline{stroke:#ff2fb3;stroke-width:1px;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;pointer-events:none}
#stage2d .outprev{fill:none;stroke:var(--accent);stroke-width:1.6px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
#stage2d .edge:hover,#stage2d .edge.on{stroke:color-mix(in srgb,var(--accent) 45%,transparent)}
#props2d .grp{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border:1px solid var(--line);border-radius:7px;color:var(--muted)}
#props2d input.nonint{border-color:var(--awas);color:var(--awas)}
#props2d{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;align-content:flex-start;padding:7px 12px;
  border-top:1px solid var(--line);background:var(--panel);height:112px;overflow:auto}   /* tinggi tetap: memilih bentuk tidak menggeser gambar */
#props2d label{display:flex;align-items:center;gap:5px;color:var(--muted)}
#props2d input[type=number]{width:72px}
.muted{color:var(--muted)}
canvas{display:block}
.sec h3{font-size:12px;margin:14px 12px 4px}
.it{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:5px 12px;cursor:pointer;border-top:1px solid var(--line)}
.it:hover{background:var(--bg)}
.lv{font-size:10px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:4px;height:fit-content;
  border:1px solid currentColor;margin-top:1px}
.lv.gagal{color:var(--gagal)} .lv.sesak{color:var(--sesak)} .lv.awas{color:var(--awas)}
.lv.ok{color:var(--ok)} .lv.info{color:var(--info)}
.sum{padding:10px 12px;border-bottom:1px solid var(--line)}
.sum b{font-size:14px}
.edit{padding:0 12px 12px;display:grid;gap:6px}
.edit .r{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center}
.edit input{width:100%}
.err{color:var(--gagal);padding:6px 12px;white-space:pre-wrap}
.hint{color:var(--muted);padding:0 12px 8px}
#busy{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--view) 70%,transparent);z-index:3}
#toast button{margin-left:12px;background:transparent;color:inherit;border-color:currentColor}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:8px;z-index:20;max-width:80vw;display:none;box-shadow:0 4px 18px #0006}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;
  width:min(1080px,96vw);max-height:94vh;overflow:auto}
dialog.small{width:min(520px,96vw)}
dialog::backdrop{background:#0008}
.dl{padding:16px 18px;display:grid;gap:12px}
.dl h3{margin:0;font-size:15px}
.dl .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.dl .grid2 label,.dl .ctl label{display:grid;gap:3px;color:var(--muted)}
.dl .grid2 label.row,.dl .ctl label.row{display:flex;align-items:center;gap:6px}
.dl input[type=number],.dl input[type=text],.dl select{width:100%}
.dl .pair{display:flex;gap:6px}
.dl .foot{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel);padding:8px 0 2px;border-top:1px solid var(--line)}
.tr{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}
.tr .ctl{display:grid;gap:8px;align-content:start}
.tr .ctl fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 10px;display:grid;gap:7px}
.tr .ctl legend{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
.tr input[type=range]{width:100%}
.tr .pv{background:var(--view);border:1px solid var(--line);border-radius:8px;min-height:360px;display:grid;
  place-items:center;overflow:hidden;position:relative}
.tr .pv svg{width:100%;height:auto;max-height:62vh;display:block}
.tr .stat{color:var(--muted);margin-top:6px}
.tr .warn{color:var(--awas)}
@media (max-width:1000px){ main{grid-template-columns:1fr;grid-auto-rows:minmax(320px,auto)} #view3d{min-height:420px}
  .tr{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Rakit Box</h1>
  <span class="src" id="src"></span>
  <label class="f">Tebal <input type="number" id="thk" step="0.1" min="0.1"> mm</label>
  <label class="f">Kerf <input type="number" id="kerf" step="0.05" min="0"> mm</label>
  <button class="primary" id="apply">Periksa ulang</button>
  <button id="b-autoslot" title="Sambungan tab + slot otomatis antara dua panel yang menempel, atau slot saja untuk tab yang sudah ada">Sambungan otomatis…</button>
  <button id="export">Ekspor DXF + SVG</button>
  <button id="undo" title="Ctrl+Z">Urungkan</button>
  <button id="redo" title="Ctrl+Shift+Z">Ulangi</button>
  <span class="badge" id="badge">…</span>
</header>
<main>
  <aside class="left">
    <h2>Panel <span><button id="gen" title="buat / atur box akrilik otomatis">Generator box…</button>
      <button id="newpanel" title="buat panel kotak baru">+ Panel</button></span></h2>
    <div class="plist" id="plist"></div>
    <div class="hint" id="removed" hidden></div>
    <h2>Posisi di rakitan</h2>
    <div class="hint" id="nosel">Klik panel di daftar atau di gambar 3D.</div>
    <div class="edit" id="edit" hidden>
      <div class="r"><span>Nama</span><input type="text" id="e-name"></div>
      <div class="r"><span>Warna</span><span style="display:flex;gap:6px;align-items:center"><input type="color" id="e-color" value="#5b9ed6" style="width:44px;height:28px;padding:0" title="Warna panel di 3D"><button id="e-color-reset" title="kembali ke warna bawaan">Bawaan</button></span></div>
      <div class="r"><span>Origin</span><input type="text" id="e-origin" placeholder="x, y, z"></div>
      <div class="r"><span>u</span><input type="text" id="e-u" placeholder="+X atau x, y, z"></div>
      <div class="r"><span>v</span><input type="text" id="e-v" placeholder="+Z atau x, y, z"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="primary" id="e-save">Terapkan</button>
        <button id="e-snap" title="Tempelkan panel ini ke permukaan panel lain terdekat (maks 30 mm) di rakitan">Tempelkan</button>
        <button id="e-clear">Lepas dari rakitan</button>
        <button id="e-del" class="danger" title="Hapus panel ini (bisa diurungkan)">Hapus panel</button></div>
      <div class="hint" style="padding:0">Titik (x, y) panel dipetakan ke origin + x·u + y·v. Tebal memanjang ke arah u × v.</div>
    </div>
    <div class="err" id="err"></div>
  </aside>
  <section class="center">
    <div class="bar" id="bar3d">
      <span class="tabs"><button id="t3" class="on">Rakitan 3D</button><button id="t2">Panel 2D</button></span>
      <label class="f">Urai <input type="range" id="explode" min="0" max="1.2" step="0.02" value="0"></label>
      <label class="f"><input type="checkbox" id="showcol" checked> Tandai tabrakan</label>
      <label class="f"><input type="checkbox" id="xray"> Tembus pandang</label>
      <label class="f" title="Warna latar tampilan 3D">Latar <select id="bg3d"><option value="">bawaan</option><option value="#14171c">gelap</option><option value="#e9ecf1">terang</option><option value="#ffffff">putih</option><option value="#8a93a0">abu-abu</option><option value="custom">warna lain…</option></select><input type="color" id="bg3d-c" value="#14171c" hidden style="width:30px;height:24px;padding:0"></label>
      <button id="fit">Paskan</button>
      <button id="del3d" class="danger" title="Delete: hapus panel terpilih (bisa diurungkan)" disabled>Hapus panel</button>
      <span class="tabs"><button id="m-g" class="on" title="tombol G">Geser (G)</button><button id="m-r" title="tombol R">Putar (R)</button></span>
      <button id="m-sp" title="Sumbu gizmo: mengikuti panel (lurus dengan objek) atau sumbu dunia">Sumbu: panel</button>
      <label class="f" title="0 = bebas">Langkah <input type="number" id="snap-t" value="1" min="0" step="0.1"> mm</label>
      <label class="f" title="Putar: 0 = bebas dan halus. Sudut dibulatkan backend saat dilepas; hampir sejajar sumbu (±2°) dikunci lurus."><input type="number" id="snap-r" value="0" min="0" step="1"> °</label>
      <label class="f" title="Saat melepas geseran, panel menempel otomatis ke permukaan panel lain yang berdekatan (maks 8 mm)"><input type="checkbox" id="magnet3" checked> Magnet</label>
    </div>
    <div id="view3d"><div id="busy">Menghitung…</div></div>
    <div id="view2d">
      <div class="bar" id="tools2d">
        <span class="tabs"><button id="t3b">Rakitan 3D</button><button id="t2b" class="on">Panel 2D</button></span>
        <span class="sep"></span>
        <button id="tl-select" class="on" title="V">Pilih (V)</button>
        <button id="tl-circle" title="C">Lingkaran (C)</button>
        <button id="tl-rect" title="B">Kotak (B)</button>
        <span class="sep"></span>
        <button id="b-array">Larik…</button>
        <button id="b-comp">Komponen…</button>
        <button id="b-divide" title="bagi sisi panel menjadi N bagian, tab selang-seling">Bagi sisi…</button>
        <button id="b-trace">Gambar → bentuk…</button>
        <button id="b-copy" title="Salin bentuk / grup terpilih (Ctrl+C)">Salin</button><button id="b-paste" title="Tempel (Ctrl+V); di panel lain = posisi sama">Tempel</button><button id="b-dup" title="Gandakan di tempat, bergeser 10 mm (Ctrl+D)">Gandakan</button>
        <button id="b-del" class="danger" title="Delete">Hapus</button>
        <span class="sep"></span>
        <label class="f" title="0 = bebas">Langkah <input type="number" id="snap2d" value="1" min="0" step="0.5"> mm</label>
        <button id="zoom-out" title="Perkecil tampilan (tombol -)">−</button><button id="zoom-in" title="Perbesar tampilan (tombol +)">+</button>
        <label class="f" title="Garis panduan dan tempel otomatis ke tepi / tengah bentuk lain dan panel (tahan Alt = matikan sementara)"><input type="checkbox" id="magnet" checked> Magnet</label>
        <button id="fit2d">Paskan</button>
        <span class="muted" id="coord2d" style="min-width:150px"></span>
      </div>
      <div id="stage2d"></div>
      <div id="props2d"></div>
    </div>
  </section>
  <aside class="right">
    <div class="sum" id="sum"></div>
    <div id="report"></div>
  </aside>
</main>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/static/vendor/OrbitControls.js';
import { TransformControls } from '/static/vendor/TransformControls.js';

window.addEventListener('error', e => { document.getElementById('err').textContent = 'Kesalahan tampilan: ' + e.message; });
const COLORS = [0x5b9ed6,0xf2b354,0x78c285,0xcc8fc7,0x8cc7cc,0xed9990,0xb8b873,0x9e9edb,0xd9bf9e,0x99b39e];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = n => '#' + COLORS[n % COLORS.length].toString(16).padStart(6, '0');
let state = null, selected = null, mtime = 0, is2d = false;
const meshes = new Map();          // id -> {mesh, center}
let colGroup = null, mid = new THREE.Vector3();

let toastTimer = null;
function toast(msg, ms = 3500, action = null){          // action: {label, run}
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  if (action){
    const b = document.createElement('button'); b.textContent = action.label;
    b.onclick = () => { t.style.display = 'none'; action.run(); };
    t.appendChild(b);
  }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', ms);
}

// ---------- 3D ----------
const host = $('view3d');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 20000);
camera.up.set(0, 0, 1);
camera.position.set(-380, -420, 330);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-300, -500, 700); scene.add(sun);
const root = new THREE.Group(); scene.add(root);

// gizmo geser / putar seperti di Blender
const tc = new TransformControls(camera, renderer.domElement);
tc.setSpace('local'); tc.setSize(0.9); scene.add(tc);
const pivot = new THREE.Object3D(); scene.add(pivot);       // gizmo menempel di sini: sumbunya = sumbu panel (u, v, normal)
const pivot0 = new THREE.Quaternion();
let localSpace = true;
function panelBasisQ(id){
  const p = state && state.panels.find(x => x.id === id), pl = p && (p.placement || p.eff_placement);
  if (!pl) return new THREE.Quaternion();
  const u = new THREE.Vector3(...arr(pl.u ?? '+X')).normalize(), v = new THREE.Vector3(...arr(pl.v ?? '+Y')).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(u, v, new THREE.Vector3().crossVectors(u, v)));
}
function syncPivot(){
  const m = meshes.get(selected); if (!m) return;
  pivot.position.copy(m.mesh.position);
  pivot.quaternion.copy(localSpace ? panelBasisQ(selected) : new THREE.Quaternion());
  pivot0.copy(pivot.quaternion);
}
function pivotToMesh(){                                       // gerakan gizmo diteruskan ke panel (halus, tanpa pembulatan)
  const m = meshes.get(selected); if (!m) return;
  m.mesh.position.copy(pivot.position);
  m.mesh.quaternion.copy(pivot.quaternion).multiply(pivot0.clone().invert());
}
const AX = {'+X':[1,0,0],'-X':[-1,0,0],'+Y':[0,1,0],'-Y':[0,-1,0],'+Z':[0,0,1],'-Z':[0,0,-1]};
const arr = v => typeof v === 'string' ? AX[v.toUpperCase()] : v;
function nice(v){                      // vektor arah -> "+X" bila tepat di sumbu
  v.normalize();
  for (const [k, a] of Object.entries(AX)) if (Math.hypot(v.x - a[0], v.y - a[1], v.z - a[2]) < 1e-4) return k;
  return v.toArray().map(x => +x.toFixed(5));
}
function movedPlacement(){             // posisi baru panel terpilih menurut gizmo
  const p = state && state.panels.find(p => p.id === selected), m = meshes.get(selected);
  if (!p || !p.placement || !m) return null;
  const q = m.mesh.quaternion;
  if (m.mesh.position.distanceTo(m.center) < 1e-6 && Math.abs(q.w) > 1 - 1e-9) return null;
  const o = new THREE.Vector3(...arr(p.placement.origin ?? [0,0,0])).sub(m.center).applyQuaternion(q).add(m.mesh.position);
  return {origin: o.toArray().map(x => +x.toFixed(2)),
          u: nice(new THREE.Vector3(...arr(p.placement.u ?? '+X')).applyQuaternion(q)),
          v: nice(new THREE.Vector3(...arr(p.placement.v ?? '+Y')).applyQuaternion(q))};
}
tc.addEventListener('objectChange', () => {
  pivotToMesh();
  const pl = movedPlacement(), f = v => Array.isArray(v) ? v.join(', ') : v;

stage.addEventListener('contextmenu', e => e.preventDefault());
let lastEdgeClick = {i: -1, t: 0};
stage.addEventListener('pointerdown', e => {
  if (!svgEl || !svgEl.contains(e.target)) return;
  if (e.button === 1 || e.button === 2 || spaceDown){
    const vb = svgEl.viewBox.baseVal;
    panning = {x: e.clientX, y: e.clientY, vb: [vb.x, vb.y, vb.width, vb.height], k: scale2d()};
    stage.classList.add('pan'); svgEl.setPointerCapture(e.pointerId); e.preventDefault(); return;
  }
  if (e.button !== 0) return;
  svgEl.setPointerCapture(e.pointerId);
  const p = curP(), loc = toLocal(e);
  const vh = tool === 'select' && e.target.closest('[data-vh]'), oe = tool === 'select' && e.target.closest('[data-eh]');
  if (vh){ vDrag = {kind: 'vertex', i: +vh.dataset.vh, start: loc, raw: null, moved: false}; selV = vDrag.i; sel2.clear(); markSel(); return; }
  if (oe){ vDrag = {kind: 'edge', i: +oe.dataset.eh, start: loc, raw: null, moved: false}; return; }
  const eh = tool === 'select' && e.target.closest('[data-edge]');
  if (eh){                                              // seret batas panel
    const k = eh.dataset.edge, ax = k === 'left' || k === 'right' ? 0 : 1;
    edgeDrag = {k, ax, el: eh, v0: p.measure.bounds[{left: 0, bottom: 1, right: 2, top: 3}[k]], v: null, raw: null};
    eh.classList.add('on'); return;
  }
  if (tool === 'select'){
    const el = e.target.closest('[data-id]');
    if (el){
      const id = el.dataset.id, it0 = p.items.find(i => i.id === id);
      const members = it0 && it0.group ? p.items.filter(i => i.group === it0.group).map(i => i.id) : [id];
      if (e.shiftKey){ const on = sel2.has(id); members.forEach(m => on ? sel2.delete(m) : sel2.add(m)); }
      else if (!sel2.has(id)){ sel2.clear(); members.forEach(m => sel2.add(m)); }
      selV = null; markSel(); vtxHandles(); renderProps();
      if (sel2.has(id)){
        const it = p.items.find(i => i.id === id);
        drag = {start: loc, anchor: id, c0: it.center, ids: [...sel2], raw: null, dx: null, dy: null, moved: false};
      }
    } else if (!e.shiftKey){ sel2.clear(); selV = null; markSel(); vtxHandles(); renderProps(); }
  } else if (tool === 'place'){
    placeAt(loc);
  } else {
    drawing = {kind: tool, c0: loc, cur: loc};
    window.__alt = e.altKey; drawing.mgv = mg(); measure({what: tool, c0: loc, cur: loc, ...drawing.mgv}, renderPreview);
  }
});
stage.addEventListener('pointermove', e => {
  if (!svgEl) return;
  if (panning){
    const dx = (e.clientX - panning.x) / panning.k, dy = (e.clientY - panning.y) / panning.k, v = panning.vb;
    const nv = [v[0] - dx, v[1] - dy, v[2], v[3]];
    svgEl.setAttribute('viewBox', nv.join(' ')); viewBoxes.set(selected, nv); return;
  }
  const loc = toLocal(e);
  window.__alt = e.altKey;
  if (vDrag){
    const dx = loc[0] - vDrag.start[0], dy = loc[1] - vDrag.start[1];
    if (!vDrag.moved && Math.hypot(dx, dy) * scale2d() < 3) return;
    vDrag.moved = true; vDrag.raw = vDrag.kind === 'vertex' ? loc : [dx, dy];
    const body = vDrag.kind === 'vertex' ? {act: 'vertex', i: vDrag.i, to: loc} : {act: 'edge', i: vDrag.i, delta: [dx, dy]};
    vDrag.mgv = mg(); measure({what: 'outline', pts: curP().measure.outline, ...body, ...vDrag.mgv}, r => { if (!vDrag) return; outPreview(r.pts); showGuides(r.guides); $('coord2d').textContent = r.text; });
    return;
  }
  if (edgeDrag){
    edgeDrag.raw = loc[edgeDrag.ax];
    measure({what: 'edge', edge: edgeDrag.k, value: edgeDrag.raw}, r => {
      if (!edgeDrag) return;
      edgeDrag.v = r.value;
      const [sx, sy] = edgeDrag.ax === 0 ? toSvg(r.value, 0) : toSvg(0, r.value), L = edgeDrag.el;
      if (edgeDrag.ax === 0){ L.setAttribute('x1', sx); L.setAttribute('x2', sx); }
      else { L.setAttribute('y1', sy); L.setAttribute('y2', sy); }
      $('coord2d').textContent = r.text;
    });
    return;
  }
  if (drag){
    const dx = loc[0] - drag.start[0], dy = loc[1] - drag.start[1];
    if (!drag.moved && Math.hypot(dx, dy) * scale2d() < 3) return;       // ambang 3 piksel layar
    drag.moved = true; drag.raw = [dx, dy];
    drag.mgv = mg(drag.ids);
    measure({what: 'move', anchor: drag.c0, delta: [dx, dy], ...drag.mgv}, r => {
      if (!drag) return;
      drag.dx = r.dx; drag.dy = r.dy; showGuides(r.guides);
      drag.ids.forEach(id => { const el = svgEl.querySelector(`[data-id="${id}"]`);
        if (el) el.setAttribute('transform', `translate(${r.dx} ${-r.dy})`); });
      $('coord2d').textContent = r.text;
    });
  } else if (drawing){
    drawing.cur = loc; drawing.mgv = mg();
    measure({what: drawing.kind, c0: drawing.c0, cur: loc, ...drawing.mgv}, renderPreview);
  } else {
    measure({what: 'point', p: loc}, r => { if (!drag && !drawing) $('coord2d').textContent = r.text; });
  }
});
stage.addEventListener('pointerup', async e => {
  if (panning){ panning = null; stage.classList.remove('pan'); return; }
  if (vDrag){
    const d = vDrag; vDrag = null;
    if (d.moved && d.raw){
      const op = d.kind === 'vertex' ? {act: 'vertex', i: d.i, to: d.raw, ...(d.mgv || {})} : {act: 'edge', i: d.i, delta: d.raw};
      try { await edit([{op: 'outline', panel: selected, step: step() || 1, ...op}]); }
      catch (err) { toast(err.message); show2d(); }
    } else if (d.kind === 'edge' && lastEdgeClick.i === d.i && performance.now() - lastEdgeClick.t < 450){   // klik dua kali: sisipkan titik
      lastEdgeClick = {i: -1, t: 0};
      try { await edit([{op: 'outline', panel: selected, act: 'insert', i: d.i, step: step() || 1}]); selV = d.i + 1; show2d(); }
      catch (err) { toast(err.message); show2d(); }
    } else { if (d.kind === 'edge') lastEdgeClick = {i: d.i, t: performance.now()}; show2d(); }
    return;
  }
  if (edgeDrag){
    const d = edgeDrag; edgeDrag = null; d.el.classList.remove('on');
    if (d.raw !== null && d.v !== d.v0) await edit([{op: 'edges', panel: selected, [d.k]: d.raw}]).catch(() => {});
    else show2d();
    return;
  }
  if (drag){
    const d = drag; drag = null;
    if (d.moved && !(d.dx === 0 && d.dy === 0))
      await edit([{op: 'move', panel: selected, ids: d.ids, anchor: d.anchor, dx: d.raw[0], dy: d.raw[1], step: step(), ...(d.mgv || {})}]).catch(() => {});
    else show2d();
  } else if (drawing){
    const d = drawing; drawing = null;
    const old = svgEl && svgEl.querySelector('.preview'); if (old) old.remove();
    try {
      const r = await edit([{op: 'draw', panel: selected, tool: d.kind, c0: d.c0, cur: d.cur, step: step(), ...(d.mgv || {})}]);
      sel2.clear(); sel2.add(r.results[0].id); show2d();
    } catch {}
  }
});
stage.addEventListener('wheel', e => {

  const k = e.deltaY < 0 ? 0.85 : 1 / 0.85, vb = svgEl.viewBox.baseVal;
  const pt = svgEl.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;

  const nv = [s.x - (s.x - vb.x) * k, s.y - (s.y - vb.y) * k, vb.width * k, vb.height * k];

const T = {dataUrl: '', timer: null, seq: 0, res: null, showMask: false};
function prepImage(file){
  return new Promise((ok, bad) => {
    const fr = new FileReader();
    fr.onerror = () => bad(new Error('file tidak terbaca'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => bad(new Error('bukan gambar yang dikenal (pakai PNG atau JPG)'));
      im.onload = () => {
        const k = Math.min(1, 1600 / Math.max(im.width, im.height));
        if (k === 1 && file.size < 3e6) return ok(fr.result);
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        ok(file.type === 'image/png' && c.width * c.height < 2.5e6 ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.92));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    holes: !c('tr-nohole'), drop_border: c('tr-border'), min_area_mm2: g('tr-min'), simplify_mm: g('tr-simp')};
  const v = g('tr-sv') || 0, k = $('tr-sk').value;
  if (k === 'w') p.width_mm = v; else if (k === 'h') p.height_mm = v; else p.ppmm = v;
  return p;
}

        <label class="row"><input type="checkbox" id="tr-auto" checked> ambang otomatis (Otsu)</label>
        <label>Ambang <span id="v-thr">128</span><input type="range" id="tr-thr" min="0" max="255" step="1" value="128"></label>
        <label class="row"><input type="checkbox" id="tr-inv"> objek lebih terang dari latar</label>
        <label class="row"><input type="checkbox" id="tr-clahe"> ratakan kontras lokal (CLAHE)</label>
      </fieldset>
      <fieldset><legend>Rapikan hasil</legend>
        <label>Tutup celah <span id="v-close">3</span><input type="range" id="tr-close" min="0" max="12" step="1" value="3"></label>
        <label>Buang bintik &lt; (mm²) <input type="number" id="tr-min" value="4" min="0" step="1"></label>
        <label>Sederhanakan garis (mm) <input type="number" id="tr-simp" value="0.2" min="0" step="0.05"></label>
        <label class="row"><input type="checkbox" id="tr-nohole"> abaikan lubang di dalam bentuk</label>
        <span class="muted">Gambar berupa garis outline saja? Centang ini agar bagian dalam garis ikut menjadi bentuk penuh.</span>
        <label class="row"><input type="checkbox" id="tr-border"> buang yang menyentuh tepi gambar</label>
      </fieldset>
      <fieldset><legend>Pakai hasilnya</legend>
        <label>Sebagai <select id="tr-target"><option value="cut">Potongan pada panel…</option><option value="new_panel">Panel baru (bentuk terbesar = outline)</option></select></label>
        <label id="tr-pl">Panel <select id="tr-panel">${panels.map(p => `<option value="${p.id}"${cur && cur.id === p.id ? ' selected' : ''}>${p.id} ${esc(p.name)}</option>`).join('')}</select></label>
        <label id="tr-atl">Letak pusat (x, y mm) — kosong = tengah panel <span class="pair"><input type="number" id="tr-x" placeholder="x"><input type="number" id="tr-y" placeholder="y"></span></label>
        <label>Jenis <select id="tr-role"><option value="cut">potong</option><option value="guide">garis bantu saja</option></select></label>
        <label id="tr-nm" hidden>Nama panel <input type="text" id="tr-name" value="dari_gambar"></label>
      </fieldset>
    </div>
    <div><div class="pv" id="tr-pv"><span class="muted">Pilih gambar untuk memulai.</span></div>
      <label class="row" style="display:flex;gap:6px;margin-top:6px"><input type="checkbox" id="tr-mask"> tampilkan hasil pemisahan (putih = objek)</label>
      <div class="stat" id="tr-st"></div></div></div>
    <div class="foot"><button id="tr-cancel">Batal</button><button class="primary" id="tr-ok" disabled>Terapkan</button></div></div>`);
  T.dataUrl = ''; T.res = null;
  const sync = () => {
    ['con', 'bri', 'blur', 'thr', 'close'].forEach(k => { $('v-' + k).textContent = $('tr-' + k).value; });
    $('tr-thr').disabled = $('tr-auto').checked;
    const nw = $('tr-target').value === 'new_panel';
    $('tr-pl').hidden = $('tr-atl').hidden = nw; $('tr-nm').hidden = !nw;
  };
  d.addEventListener('input', e => { sync(); if (T.dataUrl && e.target.id !== 'tr-file' && !/^tr-(target|panel|x|y|role|name)$/.test(e.target.id)) scheduleTrace(); });
  d.addEventListener('change', e => { if (e.target.id === 'tr-mask' && T.res) drawTrace(); });
  sync();
  $('tr-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { T.dataUrl = await prepImage(f); scheduleTrace(); } catch (er) { $('tr-st').innerHTML = `<span class="warn">${esc(er.message)}</span>`; }
  };
  $('tr-cancel').onclick = () => { T.seq++; d.close(); };
  $('tr-ok').onclick = async () => {
    const x = $('tr-x').value, y = $('tr-y').value, mode = $('tr-target').value;
    const body = {image: T.dataUrl, params: traceParams(), mode, target: $('tr-panel').value, role: $('tr-role').value,
      name: $('tr-name').value.trim(), at: x !== '' && y !== '' ? [parseFloat(x), parseFloat(y)] : null, anchor: 'center'};
    $('tr-ok').disabled = true; $('tr-st').textContent = 'menerapkan…';
    try {
      const r = await api('/api/trace/apply', body, true);
      state.panels = r.panels; mtime = r.mtime; stale = true;
      const a = r.applied;
      d.close(); T.seq++;
      selected = a.panel; sel2.clear(); (a.ids || []).forEach(i => sel2.add(i));
      renderList(); showSelected(); tab(false); scheduleReload();
      toast(mode === 'new_panel' ? `Panel ${a.panel} dibuat: ${a.size_mm[0]} × ${a.size_mm[1]} mm, ${a.shapes} potongan`
        : `${a.shapes} bentuk ditempel di ${a.panel} (${a.size_mm[0]} × ${a.size_mm[1]} mm)`, 5000);
    } catch (e) { $('tr-st').innerHTML = `<span class="warn">${esc(e.message)}</span>`; $('tr-ok').disabled = false; }
  };
}
$('b-trace').onclick = openTrace;

// ---------- tombol umum ----------
$('removed').addEventListener('click', async e => {
  const b = e.target.closest('[data-restore]'); if (!b) return;
  try { await edit([{op: 'restore_panel', panel: b.dataset.restore}]); await load(false); toast(`${b.dataset.restore} dipulihkan`); } catch {}
});
$('plist').addEventListener('click', e => {
  const x = e.target.closest('[data-del]'); if (x){ e.stopPropagation(); deletePanel(x.dataset.del); return; }
  const r = e.target.closest('.row'); if (r) select(r.dataset.id);
});
$('report').addEventListener('click', e => { const r = e.target.closest('.it'); if (r && r.dataset.p) select(r.dataset.p.split(',')[0]); });
$('apply').onclick = () => postSpec({thickness: +$('thk').value, kerf: +$('kerf').value}).catch(() => {});
$('e-save').onclick = () => {
  try {
    const pl = {origin: vec($('e-origin').value, 'origin'), u: vec($('e-u').value, 'u'), v: vec($('e-v').value, 'v')};
    if (typeof pl.origin === 'string') throw new Error('origin: tulis 3 angka (x, y, z)');
    postSpec({panels: {[selected]: {name: $('e-name').value.trim(), placement: pl}}}).catch(() => {});
  } catch (e) { $('err').textContent = e.message; }
};
$('e-clear').onclick = () => postSpec({panels: {[selected]: {placement: null}}}).catch(() => {});
$('export').onclick = async () => {
  try { const r = await api('/api/export', {}); $('err').style.color = 'var(--ok)';
    $('err').textContent = 'Tersimpan:\n' + r.files.join('\n'); setTimeout(() => $('err').style.color = '', 50); } catch {}
};
['explode', 'showcol', 'xray'].forEach(id => $(id).addEventListener('input', applyView));
$('fit').onclick = () => fit();
$('e-color').oninput = () => {                // pratinjau langsung di 3D, disimpan saat dilepas
  const m = meshes.get(selected); if (m) m.mesh.material.color.set($('e-color').value);
};
$('e-color').onchange = () => { if (selected) postSpec({panels: {[selected]: {color: $('e-color').value}}}).catch(() => {}); };
$('e-color-reset').onclick = () => { if (selected) postSpec({panels: {[selected]: {color: null}}}).catch(() => {}); };
function setBg(v, save){
  const c = v === 'custom' ? $('bg3d-c').value : v;
  $('bg3d-c').hidden = v !== 'custom';
  host.style.background = c || '';
  if (save) { try { localStorage.setItem('bg3d', JSON.stringify({v, c: $('bg3d-c').value})); } catch {} }
}
$('bg3d').onchange = () => setBg($('bg3d').value, true);
$('bg3d-c').oninput = () => setBg('custom', true);
try { const b = JSON.parse(localStorage.getItem('bg3d') || 'null'); if (b){ $('bg3d').value = b.v; $('bg3d-c').value = b.c; setBg(b.v, false); } } catch {}
$('e-snap').onclick = () => {
  if (!selected) return toast('Pilih panel dulu');
  const others = state.panels.filter(p => p.id !== selected);
  const d = dlg(`<div class="dl"><h3>Tempelkan ${esc(selected)} ke panel lain</h3>
    <div class="muted">Panel digeser sampai permukaannya menyentuh permukaan panel tujuan (jarak awal maksimal 30 mm). Pilih "terdekat" untuk menempel ke permukaan yang paling dekat, atau pilih satu panel bila ada dua dinding berhadapan.</div>
    <label style="margin-top:8px">Tempelkan ke <select id="sn-to"><option value="">permukaan terdekat (semua panel)</option>${others.map(p => `<option value="${p.id}">${p.id} ${esc(p.name)}</option>`).join('')}</select></label>
    <div class="stat" id="sn-info" style="margin-top:8px"></div>
    <div class="foot"><button id="sn-cancel">Batal</button><button class="primary" id="sn-ok">Tempelkan</button></div></div>`, true);
  $('sn-cancel').onclick = () => d.close();
  $('sn-ok').onclick = async () => {
    try {
      const r = await api('/api/edit', {ops: [{op: 'place_move', panel: selected, delta: [0, 0, 0], magnet: true, tol: 30, target: $('sn-to').value || null}]}, true);
      d.close(); await load(false); toast(r.results[0].text, 7000, {label: 'Urungkan', run: undo});
    } catch (e) { $('sn-info').textContent = e.message; }
  };
};
$('m-sp').onclick = () => { localSpace = !localSpace; tc.setSpace(localSpace ? 'local' : 'world');
  $('m-sp').textContent = 'Sumbu: ' + (localSpace ? 'panel' : 'dunia'); syncPivot(); };
$('m-g').onclick = () => setMode('translate'); $('m-r').onclick = () => setMode('rotate');
$('snap-t').oninput = $('snap-r').oninput = setSnap; setSnap();
$('undo').onclick = undo; $('redo').onclick = redo;
function tab(on3){
  is2d = !on3;
  $('t3').classList.toggle('on', on3); $('bar3d').hidden = !on3;
  $('view3d').style.display = on3 ? '' : 'none'; $('view2d').style.display = on3 ? 'none' : 'grid';
  applyView(); resize();
}
$('t3').onclick = $('t3b').onclick = () => tab(true);
$('t2').onclick = $('t2b').onclick = () => tab(false);
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || $('dlg').open) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && is2d && (k === 'c' || k === 'v' || k === 'd')){
    e.preventDefault();
    if (k === 'c') copySel(); else if (k === 'v') pasteClip(false); else if (copySel(true)) pasteClip(true);
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k === 'g' && is2d){ e.preventDefault(); groupSel(!e.shiftKey); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (is2d){
    if (k === ' '){ spaceDown = true; e.preventDefault(); }
    else if (k === 'v') setTool('select');
    else if (k === 'c') setTool('circle');
    else if (k === 'b') setTool('rect');
    else if (k === '+' || k === '=') zoomView(0.8);
    else if (k === '-') zoomView(1.25);
    else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); if (selV !== null && !sel2.size) delVertex(); else deleteSel(); }
    else if (k === 'escape'){ if (tool !== 'select') setTool('select'); else { sel2.clear(); selV = null; markSel(); vtxHandles(); renderProps(); } }
    return;
  }
  if (k === 'g') setMode('translate');
  else if (k === 'r') setMode('rotate');
  else if (k === 'x' || k === 'y' || k === 'z') lockAxis(k.toUpperCase());
  else if (k === 'delete' && selected) deletePanel(selected);
  else if (k === 'escape') select(null);
});
addEventListener('keyup', e => { if (e.key === ' ') spaceDown = false; });
if (location.hash.length > 1) selected = location.hash.slice(1).split(',')[0];

// peringatan bila server yang melayani halaman ini berkode lama (mis. server lama belum ditutup)
(async () => {
  try {
    const r = await (await fetch('/api/ping')).json();
    if (r.stale) toast('Server ini memakai kode lama. Tutup server lama (Ctrl+C), jalankan ulang, lalu muat ulang halaman.', 20000);
  } catch {}
})();

// muat ulang otomatis bila file proyek diubah dari luar (CLI / LLM)
setInterval(async () => {
  try { const r = await (await fetch('/api/mtime')).json(); if (state && !stale && r.mtime !== mtime) load(false); } catch {}
}, 2000);
resize();
load(true).then(() => { if (/,2d$/.test(location.hash)) tab(false); }).catch(() => {});
window.__app = {tab, select, get state(){ return state; }, tc, pivot, meshes, THREE};
</script>
</body>
</html>
